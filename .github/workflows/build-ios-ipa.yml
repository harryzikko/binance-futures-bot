name: Build Flutter Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-flutter-ipa:
    name: Build Flutter Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize iOS Platform & Dependencies
        working-directory: ./mobile_flutter
        run: |
          flutter create --org com.binance.futures --project-name mobile_flutter --platforms=ios .
          flutter pub get

      - name: Build Flutter iOS App (Unsigned)
        working-directory: ./mobile_flutter
        run: |
          flutter build ios --no-codesign --release

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R mobile_flutter/build/ios/iphoneos/Runner.app build/Payload/
          cd build
          zip -qr BinanceFuturesBot-Flutter-unsigned.ipa Payload
          ls -lh BinanceFuturesBot-Flutter-unsigned.ipa

      - name: Upload Flutter IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BinanceFuturesBot-Flutter-unsigned.ipa
          path: build/BinanceFuturesBot-Flutter-unsigned.ipa
          retention-days: 14
