name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Application
        working-directory: ./frontend
        run: npm run build

      - name: Install CocoaPods Dependencies
        working-directory: ./frontend/ios/App
        run: |
          pod install --repo-update

      - name: Sync Capacitor iOS
        working-directory: ./frontend
        run: npx cap sync ios

      - name: Build Xcode Archive (Unsigned)
        run: |
          mkdir -p build
          xcodebuild -workspace frontend/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r -9 BinanceFuturesBot-unsigned.ipa Payload
          ls -lh BinanceFuturesBot-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BinanceFuturesBot-unsigned.ipa
          path: build/BinanceFuturesBot-unsigned.ipa
          retention-days: 14
